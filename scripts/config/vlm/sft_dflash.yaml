# Original DFlash objective; block/global batch matched to the VLM DLite control.
upstream_config: scripts/config/dflash.yaml
algorithm: dflash
target_model: Qwen/Qwen3.5-4B
train_data: /path/to/train.jsonl
output_dir: outputs/vlm_dflash
device: cuda
target_model_backend: hf_vlm
block_size: 8
batch_size: 1
accumulation_steps: 4
loss_decay_gamma: 4
log_interval: 1
save_interval: 4000
report_to: none
