target_model: Qwen/Qwen3.5-4B
train_data: /path/to/train.jsonl
output_dir: tests/outputs/vlm_sft_student
device: cuda
seed: 42
model_role: student
num_draft_layers: 2
chs_num_layers: 4
sequential_rank: 64
block_size: 8
max_length: 4096
anchors_per_sample: 2
learning_rate: 0.0001
l1_weight: 0.1
max_grad_norm: 1.0
epochs: 1
max_steps: 100
max_samples: 32
save_steps: 50
context_policy:
  prefill_text: drop
  prefill_vision: drop
  decode_mode: none
  window_size: 0
  implementation: compact
