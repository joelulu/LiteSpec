[project]
name = "litespec-vlm-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "transformers==5.20.1",
  "Pillow>=10", "PyYAML>=6", "pytest>=8", "safetensors>=0.4",
  "yunchang==0.6.4", "tqdm>=4.66",
]

[project.optional-dependencies]
cu128 = ["torch==2.9.1", "torchvision==0.24.1"]
cu130 = ["torch==2.9.1", "torchvision==0.24.1"]
accelerated = ["causal-conv1d==1.7.0", "flash-linear-attention[conv1d]==0.5.2"]

[tool.uv]
package = false
conflicts = [[{extra = "cu128"}, {extra = "cu130"}]]

[tool.uv.extra-build-dependencies]
causal-conv1d = [{requirement = "torch", match-runtime = true}]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cu128", extra = "cu128"}, {index = "pytorch-cu130", extra = "cu130"}]
torchvision = [{index = "pytorch-cu128", extra = "cu128"}, {index = "pytorch-cu130", extra = "cu130"}]
